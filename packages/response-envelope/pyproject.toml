[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ceg-response-envelope"
version = "0.1.0"
description = "Shared FastAPI API error envelope for CEG monorepo backends"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ceg_response_envelope*"]
