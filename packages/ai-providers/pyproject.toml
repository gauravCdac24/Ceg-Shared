[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-providers"
version = "0.1.0"
description = "BYO AI / multi-provider LLM client for the CeG monorepo"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "cryptography>=42.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_providers*"]
