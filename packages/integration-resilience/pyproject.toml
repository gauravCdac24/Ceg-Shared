[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-resilience"
version = "0.1.0"
description = "Shared outbox, circuit breaker, and integration health registry for the CEG fleet"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["integration_resilience*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
