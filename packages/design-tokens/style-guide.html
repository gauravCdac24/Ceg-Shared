<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CEG Government Design System</title>
  <link rel="stylesheet" href="./ceg-gov.css" />
</head>
<body class="gov-body" style="padding:24px">
  <h1 class="gov-page-title">CEG Government Design System</h1>
  <p class="gov-page-subtitle">Token swatches for all CEG products.</p>
  <section>
    <h2 style="font-size:12px;text-transform:uppercase;color:var(--gov-text-secondary)">Colors</h2>
    <div class="gov-token-grid">
      <div class="gov-token-swatch"><div class="gov-token-swatch__color" style="background:#1B3A6B"></div><div class="gov-token-swatch__label">primary</div></div>
      <div class="gov-token-swatch"><div class="gov-token-swatch__color" style="background:#C8932A"></div><div class="gov-token-swatch__label">accent</div></div>
      <div class="gov-token-swatch"><div class="gov-token-swatch__color" style="background:#2D7D46"></div><div class="gov-token-swatch__label">success</div></div>
    </div>
  </section>
  <section>
    <button type="button" class="gov-btn gov-btn--primary">Primary</button> 
    <span class="gov-badge gov-badge--active">Active</span>
  </section>
</body>
</html>
