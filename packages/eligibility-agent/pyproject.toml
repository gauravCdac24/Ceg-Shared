[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eligibility-agent"
version = "0.1.0"
description = "CV/resume screening pipeline for WorkshopOS and QuizForge"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "structlog>=24.1.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["eligibility_agent*"]

[tool.setuptools.package-data]
eligibility_agent = ["prompts/**/*.jinja"]
