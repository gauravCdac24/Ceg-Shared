[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ceg-observability"
version = "0.1.0"
description = "Shared GlitchTip/Sentry init and healthchecks.io beat pings for CEG backends"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sentry = ["sentry-sdk>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ceg_observability*"]
