[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.1.0"
description = "Shared AI agent runtime for the CeG monorepo"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "structlog>=24.1.0",
    "ai-providers",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
health = ["psutil>=5.9"]
observability = ["langfuse>=2.0"]
pdf = ["pypdf>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_core*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
